server {
    listen 80;
    server_name @DOMAIN@;
    return 301 https://$host$request_uri;
    more_clear_headers Server;
    more_set_headers "X-Content-Type-Options: nosniff";
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) { return 405; }
}

server {
    listen 443 ssl;
    server_name @DOMAIN@;
    ssl_certificate @SSL_CERT@;
    ssl_certificate_key @SSL_KEY@;
    # OCSP stapling, verified against the issuing chain. Takes effect when the
    # certificate carries an OCSP responder URL; Let's Encrypt certificates
    # issued after May 2025 do not, in which case nginx notes it and skips.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate @SSL_CHAIN@;
    resolver 127.0.0.53 valid=300s ipv6=off;
    resolver_timeout 5s;
    more_clear_headers Server;
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
    server_tokens off;
    client_max_body_size 55G;

    location = /favicon.ico { access_log off; log_not_found off; }
    location /static/ {
        alias @APP_DIR@/staticfiles/;
        autoindex off;
        error_page 403 = @static_404;
        more_set_headers "X-Content-Type-Options: nosniff";
        more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
        more_set_headers "Cross-Origin-Resource-Policy: same-origin";
        more_set_headers "Cache-Control: public, max-age=2592000, immutable";
    }
    location @static_404 { return 404; }
    # The Django admin and the researcher API are reachable only from the
    # networks listed in ADMIN_ALLOWED_CIDRS (.env); everything else gets a
    # 404, not a 403. Donated data must never leave the local network.
    location /admin/ {
@ADMIN_ALLOW@
        deny all;
        error_page 403 = @static_404;
        limit_req zone=portability burst=20 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/portability/portability-server.sock;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_max_temp_file_size 0;
        more_set_headers "Cache-Control: no-store, no-cache, must-revalidate";
    }
    location /api/ {
@ADMIN_ALLOW@
        deny all;
        error_page 403 = @static_404;
        limit_req zone=portability burst=20 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/portability/portability-server.sock;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_max_temp_file_size 0;
        more_set_headers "Cache-Control: no-store, no-cache, must-revalidate";
    }
    # Token URLs (donation and participant entry links) and OAuth callbacks
    # carry credentials in the request line, so they are not access-logged.
    location ~ ^/(donate|participant)/[0-9a-fA-F-]{36}/$ {
        access_log off;
        limit_req zone=portability burst=20 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/portability/portability-server.sock;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_max_temp_file_size 0;
        more_set_headers "Cache-Control: no-store, no-cache, must-revalidate";
    }
    location /oauth/ {
        access_log off;
        limit_req zone=portability burst=20 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/portability/portability-server.sock;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_max_temp_file_size 0;
        more_set_headers "Cache-Control: no-store, no-cache, must-revalidate";
    }
    location / {
        limit_req zone=portability burst=20 nodelay;
        include proxy_params;
        proxy_pass http://unix:/run/portability/portability-server.sock;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_max_temp_file_size 0;
        more_set_headers "Cache-Control: no-store, no-cache, must-revalidate";
    }
    if ($request_method !~ ^(GET|HEAD|POST|DELETE)$) { return 405; }
}
