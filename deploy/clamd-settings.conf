# Scanner settings this service requires, in bytes and plain values so that
# they can be compared against what clamd reports as being in effect.
#
# clamd has no include directive, so these lines are merged into
# /etc/clamav/clamd.conf rather than installed as a file of their own. That
# file is generated by the clamav-daemon package and regenerated by
# dpkg-reconfigure, which is why the settings are re-applied on deployment and
# checked on every verification run.
#
# Rationale:
#   MaxFileSize/MaxScanSize  an archive can be tens of GB; the defaults are 25
#                            and 100 MB, and anything above them is skipped
#   MaxScanTime              50 GB at a few tens of MB/s is around 40 minutes
#   MaxFiles                 a Google export holds far more than 10000 members
#   AlertExceedsMax          without it every limit above fails open: a file
#                            that could not be scanned is reported clean
#   AlertEncryptedArchive    an encrypted archive cannot be scanned, and cannot
#                            be read by this service either
MaxFileSize 52428800000
MaxScanSize 52428800000
MaxScanTime 3600000
MaxFiles 0
AlertExceedsMax yes
AlertEncryptedArchive yes
